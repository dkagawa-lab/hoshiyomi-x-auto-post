name: HOSHIYOMI Instagram auto post

on:
  schedule:
    # UTC. Runs at 00:05 / 08:05 / 22:05 JST.
    - cron: "5 15 * * *"
    - cron: "5 23 * * *"
    - cron: "5 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 means generate image/caption only without posting"
        default: "1"
      slot:
        description: "Optional: midnight / morning / noon / night"
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post-instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post to Instagram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          SITE_URL: https://hoshiyomi4u.com/m
          TREND_HASHTAGS: ${{ vars.TREND_HASHTAGS }}
          ENABLE_X_TRENDS: ${{ vars.ENABLE_X_TRENDS || '0' }}
          X_TRENDS_WOEID: ${{ vars.X_TRENDS_WOEID || '23424856' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            case "${{ github.event.schedule }}" in
              "5 15 * * *") SLOT="midnight" ;;
              "5 23 * * *") SLOT="morning" ;;
              "5 13 * * *") SLOT="night" ;;
            esac
          fi

          if [ -n "$SLOT" ]; then
            python instagram_post.py "$SLOT"
          else
            python instagram_post.py
          fi
