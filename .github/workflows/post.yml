name: HOSHIYOMI X auto post

on:
  schedule:
    # UTC. Runs at 00:17 / 08:17 / 12:47 / 22:17 JST.
    # Avoid :00 because GitHub scheduled workflows are often delayed at the top of the hour.
    - cron: "17 15 * * *"
    - cron: "17 23 * * *"
    - cron: "47 3 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 means generate text only without posting"
        default: "1"
      slot:
        description: "Optional: midnight / morning / noon / night"
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and post
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://hoshiyomi4u.com/m
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          if [ -z "$SLOT" ]; then
            case "${{ github.event.schedule }}" in
              "17 15 * * *") SLOT="midnight" ;;
              "17 23 * * *") SLOT="morning" ;;
              "47 3 * * *") SLOT="noon" ;;
              "17 13 * * *") SLOT="night" ;;
            esac
          fi

          if [ -n "$SLOT" ]; then
            python generate_and_post.py "$SLOT"
          else
            python generate_and_post.py
          fi
